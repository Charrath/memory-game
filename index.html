<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/images/favicon.png" type="image/png" />
    <title>Memory</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <section id="home-screen" class="home" hidden>
        <header>
          <p class="home__subtitle">It's play time.</p>
          <h1 class="home__title">Ready to play?</h1>
        </header>

        <div
          class="home__decoration game-controller"
          role="img"
          aria-label="Illustration of a game controller"
        ></div>

        <button class="home__button button button--primary" type="button">
          <span
            class="home__button-icon game-controller"
            aria-hidden="true"
          ></span
          ><span class="home__button-text">Play</span>
          <span class="home__button-arrow">→</span>
        </button>
      </section>

      <section id="settings-screen" class="settings">
        <div class="settings__content">
          <h1>Settings</h1>
          <img src="/public/assets/images/icons/long-yellow-arrow.svg" alt="" />

          <fieldset>
            <legend class="settings__legend settings__legend--themes">
              Game themes
            </legend>

            <div class="settings__options">
              <label class="settings__option">
                <input type="radio" name="theme" value="coding" checked />
                Code vibes theme
              </label>

              <label class="settings__option">
                <input type="radio" name="theme" value="gaming" />
                Gaming theme
              </label>

              <label class="settings__option">
                <input type="radio" name="theme" value="projects" />
                DA Projects theme
              </label>

              <label class="settings__option">
                <input type="radio" name="theme" value="foods" />
                Foods theme
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend class="settings__legend settings__legend--player">
              Choose player
            </legend>

            <div class="settings__options">
              <label class="settings__option">
                <input type="radio" name="player" value="blue" />
                Blue
              </label>

              <label class="settings__option">
                <input type="radio" name="player" value="orange" />
                Orange
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend class="settings__legend settings__legend--board">
              Board size
            </legend>
            <div class="settings__options">
              <label class="settings__option">
                <input type="radio" name="board" value="16" />
                16 cards
              </label>
              <label class="settings__option">
                <input type="radio" name="board" value="24" />
                24 cards
              </label>
              <label class="settings__option">
                <input type="radio" name="board" value="32" />
                32 cards
              </label>
            </div>
          </fieldset>
        </div>
      </section>
    </main>
    <!-- <section id="field">
      <button class="card">
        <div class="card__inner">
          <div class="card__face"></div>
          <div class="card__face card__face--back"></div>
        </div>
      </button>
    </section> -->
  </body>
</html>
